name: Quality and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test tools/run-fast-tests.test.mjs tools/npm-cli.test.mjs tools/wasm-incremental-reload.test.mjs
      - run: pnpm test:fast

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Verify public signal and authority artifacts
        run: |
          pnpm package:signals
          pnpm test:signals-package
          pnpm package:authority
          pnpm package:session
          node tools/package-peer-session.mjs --no-native-rtc --output artifacts/peer-session-relay
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/coverage-summary.json
            artifacts/signals/*.tgz
            artifacts/signals/*.consumer.json
            artifacts/authority/*.tgz
            artifacts/peer-session/*.tgz
            artifacts/peer-session/package/provenance.json
            artifacts/peer-session-relay/*.tgz
            artifacts/peer-session-relay/package/provenance.json
          if-no-files-found: warn
          retention-days: 30

  conformance:
    name: Conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance
      - name: Preserve conformance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: conformance-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/conformance/report.json
          if-no-files-found: error
          retention-days: 30

  compare-conformance:
    name: Compare portable conformance digests
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          pattern: conformance-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/conformance-platforms
      - run: pnpm conformance:compare artifacts/conformance-platforms --require-platform linux --require-platform darwin
