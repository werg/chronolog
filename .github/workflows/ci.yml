name: Quality and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Verify public signal and participant artifacts
        run: |
          pnpm package:signals
          pnpm test:signals-package
          pnpm package:control
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/coverage-summary.json
            artifacts/signals/*.tgz
            artifacts/signals/*.consumer.json
            artifacts/peer-generation-control/*.tgz
          if-no-files-found: warn
          retention-days: 30

  conformance:
    name: Conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance
      - name: Preserve conformance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: conformance-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/conformance/report.json
          if-no-files-found: error
          retention-days: 30

  compare-conformance:
    name: Compare portable conformance digests
    needs: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          pattern: conformance-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/conformance-platforms
      - run: pnpm conformance:compare artifacts/conformance-platforms --require-platform linux --require-platform darwin
