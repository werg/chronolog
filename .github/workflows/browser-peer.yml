name: Browser peer qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-peer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Emscripten toolchain
        run: |
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/chronolog-emsdk"
          test "$(git -C "$RUNNER_TEMP/chronolog-emsdk" rev-parse HEAD)" = e4fe26ef59168ff44f4c23c466e497bf60b3411e
          "$RUNNER_TEMP/chronolog-emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/chronolog-emsdk/emsdk" activate 4.0.20
      - name: Build the real pinned SQL engine
        run: node tools/build-wasm-engine.mjs --emsdk "$RUNNER_TEMP/chronolog-emsdk"
      - name: Compare native and WASM execution
        env:
          CHRONOLOG_REQUIRE_WASM: '1'
        run: pnpm exec vitest run packages/runtime-browser/src/wasm-conformance.test.ts
      - name: Install real Chromium with platform dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Qualify SQL-free events, native framed authority and abrupt OPFS checkpoints
        run: node --import tsx tools/test-browser-events.ts
      - name: Qualify Worker ownership, OPFS recovery and the public client
        run: node --import tsx tools/test-browser-peer.ts
      - name: Qualify enrolled browser and native agents claiming one shared task
        run: node --import tsx tools/test-browser-bridge.ts
      - name: Check out the exact public Tendriller runtime source
        uses: actions/checkout@v6
        with:
          repository: werg/tendriller
          ref: 4eb9a4fec0892378574324675611d0e0e3eecb55
          path: artifacts/pilot-source/tendriller
          persist-credentials: false
      - name: Check out the exact contrib application specimens
        uses: actions/checkout@v6
        with:
          repository: werg/tendriller-contrib
          ref: 41f0f44b7dd48e80f049d38dad7f8d6c0e452ae8
          path: artifacts/pilot-source/contrib
          persist-credentials: false
      - name: Build the packaged public Tendriller runtime
        working-directory: artifacts/pilot-source/tendriller
        run: |
          npm ci
          node scripts/build.mjs --artifacts-only
      - name: Qualify both contrib layouts with native agents and independent browser peers
        run: |
          node --import tsx tools/application-pilot.ts \
            --contrib artifacts/pilot-source/contrib \
            --tendriller-runtime artifacts/pilot-source/tendriller/dist/runtime \
            --wasm artifacts/wasm \
            --output artifacts/application-pilot/ci
      - name: Preserve the qualification and engine provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-peer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/wasm/manifest.json
            artifacts/browser-qualification/report.json
            artifacts/browser-bridge/report.json
            artifacts/browser-events/report.json
            artifacts/browser-events/bundle.json
            artifacts/application-pilot/ci/report.json
            artifacts/application-pilot/ci/bundles.json
            artifacts/application-pilot/ci/board.png
            artifacts/application-pilot/ci/compact.png
            artifacts/application-pilot/ci/pages/specimen-manifest.json
          if-no-files-found: error
          retention-days: 30
