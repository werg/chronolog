name: Browser peer qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Each isolated source snapshot must finish even while its PR keeps moving.
  group: browser-peer-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Emscripten toolchain
        run: |
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/chronolog-emsdk"
          test "$(git -C "$RUNNER_TEMP/chronolog-emsdk" rev-parse HEAD)" = e4fe26ef59168ff44f4c23c466e497bf60b3411e
          "$RUNNER_TEMP/chronolog-emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/chronolog-emsdk/emsdk" activate 4.0.20
      - name: Build the real pinned SQL engine
        id: sql_engine
        run: node tools/build-wasm-engine.mjs --emsdk "$RUNNER_TEMP/chronolog-emsdk"
      - name: Compare native and WASM execution
        env:
          CHRONOLOG_REQUIRE_WASM: '1'
        run: pnpm exec vitest run packages/runtime-browser/src/wasm-conformance.test.ts
      - name: Package the SQL-free public browser session
        id: session_events
        if: ${{ !cancelled() }}
        run: node tools/package-peer-session.mjs --native-rtc --output artifacts/peer-session-browser-events
      - name: Package matching browser and native SQL engines
        id: session_sql
        if: ${{ !cancelled() && steps.sql_engine.outcome == 'success' }}
        run: node tools/package-peer-session.mjs --sql-native --sql-browser artifacts/wasm --native-rtc --output artifacts/peer-session-browser-sql
      - name: Install real Chromium with platform dependencies
        id: chromium
        if: ${{ !cancelled() && steps.sql_engine.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Check out the exact independent application consumers
        id: contrib_source
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        uses: actions/checkout@v6
        with:
          repository: werg/tendriller-contrib
          ref: 3107cba13007633177b5003c379ff481b20e5481
          path: artifacts/tendriller-contrib
          persist-credentials: false
      - name: Qualify native and browser WebRTC after signaling host shutdown
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.contrib_source.outcome == 'success' }}
        run: node --import tsx tools/test-browser-webrtc.ts --contrib artifacts/tendriller-contrib --output artifacts/browser-webrtc
      - name: Qualify SQL-free events, native framed authority and abrupt OPFS checkpoints
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node --import tsx tools/test-browser-events.ts
      - name: Qualify Worker ownership, OPFS recovery and the public client
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node --import tsx tools/test-browser-peer.ts
      - name: Qualify public events through the packed Worker facade and native RTC
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.contrib_source.outcome == 'success' && steps.session_events.outcome == 'success' }}
        shell: bash
        run: |
          archives=(artifacts/peer-session-browser-events/chronolog-peer-session-*.tgz)
          test "${#archives[@]}" -eq 1
          node artifacts/tendriller-contrib/cookbooks/run-a-peer-application/checks/run-peer-generation-browser.mjs --artifact "${archives[0]}" --output artifacts/peer-session-browser-events-consumer
      - name: Qualify task claims and recovery through packed browser and native SQL
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.contrib_source.outcome == 'success' && steps.session_sql.outcome == 'success' }}
        shell: bash
        run: |
          archives=(artifacts/peer-session-browser-sql/chronolog-peer-session-*.tgz)
          test "${#archives[@]}" -eq 1
          node artifacts/tendriller-contrib/cookbooks/run-a-peer-application/checks/run-peer-generation-browser.mjs --domain tasks --artifact "${archives[0]}" --output artifacts/peer-session-browser-tasks-consumer
      - name: Preserve the qualification and engine provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-peer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/wasm/manifest.json
            artifacts/peer-session-browser-sql/*.tgz
            artifacts/peer-session-browser-sql/package/provenance.json
            artifacts/browser-qualification/report.json
            artifacts/browser-events/report.json
            artifacts/browser-events/bundle.json
            artifacts/browser-webrtc/report.json
            artifacts/browser-webrtc/bundle.json
            artifacts/peer-session-browser-events/*.tgz
            artifacts/peer-session-browser-events/package/provenance.json
            artifacts/peer-session-browser-events-consumer/report.json
            artifacts/peer-session-browser-events-consumer/summary.json
            artifacts/peer-session-browser-events-consumer/consumer/package-lock.json
            artifacts/peer-session-browser-tasks-consumer/report.json
            artifacts/peer-session-browser-tasks-consumer/summary.json
            artifacts/peer-session-browser-tasks-consumer/consumer/package-lock.json
          if-no-files-found: error
          retention-days: 30
