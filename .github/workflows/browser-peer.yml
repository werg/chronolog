name: Browser peer qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Each isolated source snapshot must finish even while its PR keeps moving.
  group: browser-peer-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Emscripten toolchain
        run: |
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/chronolog-emsdk"
          test "$(git -C "$RUNNER_TEMP/chronolog-emsdk" rev-parse HEAD)" = e4fe26ef59168ff44f4c23c466e497bf60b3411e
          "$RUNNER_TEMP/chronolog-emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/chronolog-emsdk/emsdk" activate 4.0.20
      - name: Build the real pinned SQL engine
        id: sql_engine
        run: node tools/build-wasm-engine.mjs --emsdk "$RUNNER_TEMP/chronolog-emsdk"
      - name: Compare native and WASM execution
        env:
          CHRONOLOG_REQUIRE_WASM: '1'
        run: pnpm exec vitest run packages/runtime-browser/src/wasm-conformance.test.ts
      - name: Install real Chromium with platform dependencies
        id: chromium
        if: ${{ !cancelled() && steps.sql_engine.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Check out the exact contrib application specimens
        id: contrib_source
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        uses: actions/checkout@v6
        with:
          repository: werg/tendriller-contrib
          ref: 5dc1e63365c4d073f03c6491ec5e84ed14c26f73
          path: artifacts/pilot-source/contrib
          persist-credentials: false
      - name: Qualify native and browser WebRTC after signaling host shutdown
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' && steps.contrib_source.outcome == 'success' }}
        run: node --import tsx tools/test-browser-webrtc.ts --contrib artifacts/pilot-source/contrib --output artifacts/browser-webrtc
      - name: Qualify SQL-free events, native framed authority and abrupt OPFS checkpoints
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node --import tsx tools/test-browser-events.ts
      - name: Qualify Worker ownership, OPFS recovery and the public client
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node --import tsx tools/test-browser-peer.ts
      - name: Qualify enrolled browser and native agents claiming one shared task
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node --import tsx tools/test-browser-bridge.ts
      - name: Check out the exact public Tendriller runtime source
        id: tendriller_source
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        uses: actions/checkout@v6
        with:
          repository: werg/tendriller
          ref: 90cfb7943206872cda9192c095fd83d68db60f98
          path: artifacts/pilot-source/tendriller
          persist-credentials: false
      - name: Build the packaged public Tendriller SDK, runtime and engine
        id: public_artifacts
        if: ${{ !cancelled() && steps.tendriller_source.outcome == 'success' }}
        working-directory: artifacts/pilot-source/tendriller
        run: |
          npm ci
          npm run build
      - name: Qualify both contrib layouts with native agents and independent browser peers
        id: application_pilot
        if: ${{ !cancelled() && steps.public_artifacts.outcome == 'success' && steps.contrib_source.outcome == 'success' }}
        run: |
          node --import tsx tools/application-pilot.ts \
            --contrib artifacts/pilot-source/contrib \
            --tendriller-runtime artifacts/pilot-source/tendriller/dist/runtime \
            --tendriller-engine artifacts/pilot-source/tendriller/dist/engine \
            --wasm artifacts/wasm \
            --output artifacts/application-pilot/ci
      - name: Preserve application qualification immediately
        if: ${{ always() && (steps.application_pilot.outcome == 'success' || steps.application_pilot.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: application-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/application-pilot/ci/report.json
            artifacts/application-pilot/ci/bundles.json
            artifacts/application-pilot/ci/route-trace.ndjson
            artifacts/application-pilot/ci/*.png
            artifacts/application-pilot/ci/pages/specimen-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Qualify thin Cloudflare membership with a separate native authority and browser device
        if: ${{ !cancelled() && steps.public_artifacts.outcome == 'success' }}
        run: |
          node --import tsx tools/thin-membership-pilot.ts \
            --tendriller-artifacts artifacts/pilot-source/tendriller/dist \
            --wasm artifacts/wasm \
            --output artifacts/thin-membership/ci
      - name: Preserve the qualification and engine provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-peer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/wasm/manifest.json
            artifacts/browser-qualification/report.json
            artifacts/browser-bridge/report.json
            artifacts/browser-events/report.json
            artifacts/browser-events/bundle.json
            artifacts/browser-webrtc/report.json
            artifacts/browser-webrtc/bundle.json
            artifacts/application-pilot/ci/report.json
            artifacts/application-pilot/ci/bundles.json
            artifacts/application-pilot/ci/route-trace.ndjson
            artifacts/application-pilot/ci/*.png
            artifacts/application-pilot/ci/pages/specimen-manifest.json
            artifacts/thin-membership/ci/report.json
            artifacts/thin-membership/ci/bundles.json
            artifacts/thin-membership/ci/membership-provenance.json
            artifacts/thin-membership/ci/host/host-results.json
            artifacts/thin-membership/ci/*.png
          if-no-files-found: error
          retention-days: 30
