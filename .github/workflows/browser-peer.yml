name: Portable WASM execution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-wasm:
    name: Zero-native QuickJS-NG + SQLite-CAS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run packages/sqlite-cas packages/materializer
      - name: Package relay-only portable session archive
        run: node tools/package-peer-session.mjs --no-native-rtc --output artifacts/session-relay
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: portable-wasm-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/session-relay/*.tgz
            artifacts/session-relay/package/provenance.json
          if-no-files-found: warn
          retention-days: 30
