name: WebRTC native and browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: webrtc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify bounded framing and native ICE/DTLS/SCTP
        run: pnpm exec vitest run packages/transport-webrtc/src
      - name: Check out the exact public resident deployment recipe
        uses: actions/checkout@v6
        with:
          repository: werg/tendriller-contrib
          ref: bf09a7948f9bb504f2ac5d6e3903daec4d0ca774
          path: artifacts/tendriller-contrib
          persist-credentials: false
      - name: Qualify the native HTTPS resident task and current reader authorization
        run: node --import tsx tools/test-resident-webrtc.ts --contrib artifacts/tendriller-contrib --output artifacts/resident-webrtc
      - name: Install actual Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Qualify OPFS peer after page and signaling host shutdown
        run: node --import tsx tools/test-browser-webrtc.ts --contrib artifacts/tendriller-contrib --output artifacts/browser-webrtc
      - name: Preserve native and browser results and emitted graphs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webrtc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/browser-webrtc/report.json
            artifacts/browser-webrtc/bundle.json
            artifacts/resident-webrtc/report.json
            artifacts/resident-webrtc/bundle.json
          if-no-files-found: error
          retention-days: 30
