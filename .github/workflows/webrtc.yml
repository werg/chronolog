name: Native peer transport and hosted control

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keep each reviewed source snapshot qualifying while concurrent PR work advances.
  group: webrtc-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify bounded framing and native ICE/DTLS/SCTP
        run: pnpm exec vitest run packages/transport-webrtc/src
      - name: Check out the exact public peer application consumers
        uses: actions/checkout@v6
        with:
          repository: werg/tendriller-contrib
          ref: 3107cba13007633177b5003c379ff481b20e5481
          path: artifacts/tendriller-contrib
          persist-credentials: false
      - name: Build the clean public peer-session RTC package
        run: node tools/package-peer-session.mjs --native-rtc --output artifacts/peer-session-rtc
      - name: Qualify selected-history recovery through the packed native RTC API
        shell: bash
        run: |
          archives=(artifacts/peer-session-rtc/chronolog-peer-session-*.tgz)
          test "${#archives[@]}" -eq 1
          node artifacts/tendriller-contrib/cookbooks/run-a-peer-application/checks/run-peer-generation.mjs --artifact "${archives[0]}" --transport native-rtc --output artifacts/peer-session-rtc-consumer
      - name: Qualify actual hosted control and rendezvous with packed RTC peers
        shell: bash
        run: |
          mkdir -p artifacts/tendriller-public-2e8200a3
          cp test/artifacts/tendriller-sdk-2e8200a3.tgz artifacts/tendriller-public-2e8200a3/tendriller-sdk-0.3.0-rc.9.tgz
          cp test/artifacts/tendriller-engine-2e8200a3.tgz artifacts/tendriller-public-2e8200a3/tendriller-engine-0.3.0-rc.9.tgz
          cp test/artifacts/tendriller-public-2e8200a3.provenance.json artifacts/tendriller-public-2e8200a3/provenance.json
          archives=(artifacts/peer-session-rtc/chronolog-peer-session-*.tgz)
          test "${#archives[@]}" -eq 1
          node artifacts/tendriller-contrib/cookbooks/run-a-peer-application/checks/run-peer-generation-host.mjs --artifact "${archives[0]}" --artifacts artifacts/tendriller-public-2e8200a3 --output artifacts/peer-session-host-consumer
      - name: Preserve public transport and hosted control evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: webrtc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/peer-session-rtc/*.tgz
            artifacts/peer-session-rtc/package/provenance.json
            artifacts/peer-session-rtc-consumer/report.json
            artifacts/peer-session-rtc-consumer/summary.json
            artifacts/peer-session-host-consumer/host-artifacts.json
            artifacts/peer-session-host-consumer/host/package-lock.json
            artifacts/peer-session-host-consumer/peers/report.json
            artifacts/peer-session-host-consumer/peers/summary.json
          if-no-files-found: error
          retention-days: 30
