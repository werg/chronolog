name: Package and browser checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-browser-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build clean public session artifacts
        id: session_artifacts
        run: |
          node tools/package-peer-session.mjs --output artifacts/session-rtc
          node tools/package-peer-session.mjs --sql-native --output artifacts/session-sql
      - name: Verify the standard archive installs and closes native RTC without extra dependencies
        run: |
          archives=(artifacts/session-rtc/chronolog-peer-session-*.tgz)
          test "${#archives[@]}" -eq 1
          node tools/test-peer-session-package.mjs --artifact "${archives[0]}" --output artifacts/default-session-package-check
      - name: Verify the SQL session archive
        if: ${{ !cancelled() && steps.session_artifacts.outcome == 'success' }}
        shell: bash
        run: |
          archives=(artifacts/session-sql/chronolog-peer-session-*.tgz)
          test "${#archives[@]}" -eq 1
          node tools/test-peer-session-sql.mjs --artifact "${archives[0]}"
      - name: Install real Chromium and WebKit
        id: chromium
        if: ${{ !cancelled() && steps.session_artifacts.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Qualify portable SharedWorker and DedicatedWorker RTC endpoints
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: pnpm exec tsx tools/test-worker-webrtc-endpoint.ts
      - name: Qualify Chromium record stores, pinned ownership and browser restart
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: pnpm exec tsx tools/test-browser-storage.ts
      - name: Qualify WebKit record stores, pinned ownership and browser restart
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        env:
          CHRONOLOG_STORAGE_BROWSER: webkit
        run: pnpm exec tsx tools/test-browser-storage.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: package-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/session-rtc/*.tgz
            artifacts/session-rtc/package/provenance.json
            artifacts/session-sql/*.tgz
            artifacts/session-sql/package/provenance.json
            artifacts/peer-session-sql-check/report.json
            artifacts/default-session-package-check/report.json
            artifacts/default-session-package-check/native-process.json
            artifacts/default-session-package-check/consumer/package-lock.json
          if-no-files-found: error
          retention-days: 30
