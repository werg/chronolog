name: Release evidence

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-evidence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64-gnu
            os: ubuntu-22.04
          - id: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - id: linux-x64-musl
            os: ubuntu-22.04
            container: node:24-alpine
          - id: darwin-arm64
            os: macos-15
          - id: darwin-x64
            os: macos-15-intel
          - id: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        if: ${{ !matrix.container }}
      - uses: actions/setup-node@v6
        if: ${{ !matrix.container }}
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare Alpine musl build toolchain
        if: ${{ matrix.container != '' }}
        shell: sh
        run: |
          apk add --no-cache git python3 make g++ bash
          corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fast
      - run: pnpm conformance
        if: ${{ matrix.id == 'linux-x64-gnu' || matrix.id == 'darwin-x64' }}
      - run: pnpm package:signals
      - run: pnpm test:signals-package
      - run: pnpm package:control
      - name: Package relay-only and SQL peer-session profiles
        shell: bash
        run: |
          node tools/package-peer-session.mjs --no-native-rtc --output artifacts/peer-session-relay
          node tools/package-peer-session.mjs --sql-native --sql-browser --sql-wasm --output artifacts/peer-session
      - name: Verify native SQL package
        shell: bash
        run: |
          archives=(artifacts/peer-session/chronolog-peer-session-*.tgz)
          test "${#archives[@]}" -eq 1
          node tools/test-peer-session-sql.mjs --artifact "${archives[0]}"
      - run: pnpm release:metadata
      - uses: actions/attest-build-provenance@v3
        if: ${{ !matrix.container }}
        with:
          subject-path: |
            artifacts/release/sbom.cdx.json
            artifacts/release/provenance.intoto.jsonl
            artifacts/peer-session/*.tgz
            artifacts/peer-session-relay/*.tgz
            artifacts/peer-generation-control/*.tgz
            artifacts/signals/*.tgz
      - uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ matrix.id }}-${{ github.sha }}
          path: |
            artifacts/release/
            artifacts/peer-session/*.tgz
            artifacts/peer-session-relay/*.tgz
            artifacts/peer-generation-control/*.tgz
            artifacts/signals/*.tgz
            artifacts/signals/*.consumer.json
            artifacts/peer-session-sql-check/report.json
          if-no-files-found: error
          retention-days: 90

  wasm-sql-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20
      - run: pnpm install --frozen-lockfile
      - name: Build deterministic WASM SQL engine and run Node conformance
        run: |
          node tools/build-wasm-engine.mjs --emsdk "$EMSDK" --output artifacts/wasm
          CHRONOLOG_WASM_DIRECTORY=artifacts/wasm CHRONOLOG_REQUIRE_WASM=1 pnpm vitest run packages/materializer-doltlite/src/wasm-conformance.test.ts
      - uses: actions/upload-artifact@v6
        with:
          name: release-wasm-sql-${{ github.sha }}
          path: artifacts/wasm/
          if-no-files-found: error
          retention-days: 90
