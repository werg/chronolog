name: Release evidence

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-evidence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64-gnu
            os: ubuntu-24.04
          - id: darwin-arm64
            os: macos-15
          - id: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:fast
      - run: pnpm package:signals
      - run: pnpm test:signals-package
      - run: pnpm package:authority
      - name: Package universal and relay-only peer-session profiles
        shell: bash
        run: |
          node tools/package-peer-session.mjs --output artifacts/peer-session
          node tools/package-peer-session.mjs --no-native-rtc --output artifacts/peer-session-relay
      - name: Verify standard peer-session archive
        if: ${{ matrix.id == 'linux-x64-gnu' }}
        shell: bash
        run: |
          archives=(artifacts/peer-session/chronolog-peer-session-*.tgz)
          test "${#archives[@]}" -eq 1
          node tools/test-peer-session-package.mjs --artifact "${archives[0]}" --output artifacts/peer-session-check
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            artifacts/peer-session/*.tgz
            artifacts/peer-session-relay/*.tgz
            artifacts/authority/*.tgz
            artifacts/signals/*.tgz
      - uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ matrix.id }}-${{ github.sha }}
          path: |
            artifacts/peer-session/*.tgz
            artifacts/peer-session-relay/*.tgz
            artifacts/authority/*.tgz
            artifacts/signals/*.tgz
            artifacts/signals/*.consumer.json
          if-no-files-found: error
          retention-days: 90
